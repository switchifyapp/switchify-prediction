[package]
name = "switchify-neural-experiment"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
switchify-prediction = { path = "../.." }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
unicode-segmentation = "1"

[workspace]
