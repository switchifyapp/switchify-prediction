[package]
name = "switchify-prediction-neural"
version = "0.5.2"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Opt-in offline SmolLM2 refinement for Switchify Prediction"
autotests = false

[features]
test-support = []

[[bin]]
name = "fake-worker"
path = "tests/fake_worker.rs"
required-features = ["test-support"]

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
required-features = ["test-support"]

[workspace]
members = ["worker"]
resolver = "3"

# gemm's fp16 kernels keep their asm in small #[inline] helpers that gain the
# fp16 target feature only once inlined into a runtime-detected caller.
# Unoptimised builds don't inline them, so the asm fails to assemble on
# targets without fp16 in their baseline, such as aarch64-pc-windows-msvc.
# This applies only to dev and test builds; release builds are unchanged.
[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f16]
opt-level = 3

[dependencies]
switchify-prediction = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
