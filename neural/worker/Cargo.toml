[package]
name = "switchify-smol-worker"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[features]
accelerated = []
# Benchmark-only search limit overrides for low-end experiments. Never packaged.
experiment = []
# Experimental Apple GPU backend. Untested on hardware and never packaged.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
switchify-prediction-neural = { path = ".." }
anyhow = "1"
switchify-prediction = { path = "../.." }
unicode-normalization = "0.1"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
