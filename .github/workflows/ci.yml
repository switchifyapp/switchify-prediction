name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts -p "test_*.py"
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: python scripts/artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: english-prediction-database
          path: |
            artifacts/english.sqlite
            artifacts/validation.json
            artifacts/development.json
            artifacts/quality-report.json
            artifacts/partitions.json
            artifacts/source-manifest.json
            artifacts/quality-policy.json
            artifacts/ATTRIBUTION.md
            artifacts/LICENSE
            artifacts/README.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
