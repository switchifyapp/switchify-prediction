name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a matching version on main
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match Cargo.toml'
          for manifest in ['neural/Cargo.toml', 'neural/worker/Cargo.toml']:
              assert tomllib.loads(pathlib.Path(manifest).read_text())['package']['version'] == version, 'Companion versions must match'
          PY
  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
  neural:
    needs: version
    uses: ./.github/workflows/neural.yml
  draft:
    needs: [validate, neural]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
      - name: Create a draft with validated model and CLI bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file "docs/releases/$RELEASE_TAG.md" release-assets/*/*.zip release-assets/*/*.sha256
