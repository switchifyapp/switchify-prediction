name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a matching version on main
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)" || { echo 'Tag must match VERSION'; exit 1; }
  textslinger:
    needs: version
    uses: ./.github/workflows/textslinger.yml
  draft:
    needs: textslinger
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
      - name: Create a draft with the TextSlinger runtime bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file "docs/releases/$RELEASE_TAG.md" release-assets/*/*.zip release-assets/*/*.sha256
