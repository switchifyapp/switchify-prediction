[package]
name = "switchify-prediction"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Offline SQLite-backed English word prediction"
repository = "https://github.com/switchifyapp/switchify-prediction"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/source-manifest.json", "/quality-policy.json", "/production-model.json"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
